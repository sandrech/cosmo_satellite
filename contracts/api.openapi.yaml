openapi: 3.1.0
info:
  title: Cosmo Satellite API
  version: 1.0.0
paths:
  /api/health:
    get:
      responses:
        "200": { description: Backend health }
  /api/query/snapshot:
    post:
      summary: Calculate one exact model snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scenario, t_s]
              properties:
                scenario: { type: object }
                t_s: { type: number }
      responses:
        "200": { description: model-snapshot-2.0 }
        "422": { description: Validation or calculation error }
  /api/query/trace:
    post:
      summary: Calculate a finite sampled playback trace
      responses:
        "200": { description: model-trace-2.0 }
  /api/query/dynamic:
    post:
      summary: Calculate full period analytics
      responses:
        "200": { description: dynamic-analysis-2.0 }
  /api/query/compare:
    post:
      summary: Compare two complete scenarios
      responses:
        "200": { description: variant-comparison-2.0 }
  /api/export/result:
    post:
      summary: Export complete competition result
      responses:
        "200": { description: cosmo-A-result-1.0 }
  /api/workspace/state:
    post:
      summary: Persist frontend workspace state
      responses:
        "200": { description: State saved }
