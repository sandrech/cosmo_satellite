[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backend"
version = "0.1.0"
description = "Backend components for the satellite-network project"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.11,<3",
  "networkx>=3.5,<4",
]

[project.scripts]
cosmo-backend = "backend_api.server:main"

[project.optional-dependencies]
test = [
  "pytest>=8.3",
]
reference = [
  "numpy>=2,<3",
]
dev = [
  "pytest>=8.3",
  "numpy>=2,<3",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
