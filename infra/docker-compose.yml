services:
  backend:
    build:
      context: ../backend
      target: runtime
    command: ["python", "-m", "api_service.app", "--host", "0.0.0.0", "--port", "8000"]
    expose:
      - "8000"

  frontend:
    build:
      context: ../frontend
    depends_on:
      - backend
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
